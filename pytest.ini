[pytest]
# 테스트 수집 대상의 **단일 소스** (F-023).
#
# 왜 필요한가: 대상 목록이 verify-done.sh §4와 .github/workflows/validate.yml에
# 각각 하드코딩돼 있었다. 새 테스트 디렉토리(scripts/tests/)를 추가하는 순간 두 곳을
# 손으로 맞춰야 하고, 한쪽만 고치면 "로컬은 돌았는데 CI는 그 테스트를 아예 안 돌린"
# 조용한 구멍이 생긴다 — MUST MATCH 산문 계약은 반드시 드리프트한다(F-023).
# 이제 양쪽 모두 인자 없는 `pytest`를 호출하고, 대상은 여기서만 정의한다.
testpaths =
    plugins/common/hooks/tests
    evals/tests
    scripts/tests

# evals 시나리오 fixture에는 **의도적으로 실패하는** test_*.py가 들어 있다
# (에이전트가 고쳐야 할 대상 코드). 절대 수집 대상이 아니다.
# testpaths가 이미 이들을 배제하지만, 누군가 인자를 주고 실행할 때를 대비해
# 이중으로 막는다 — 수집되면 게이트가 영구 red가 된다.
# pytest 기본값(`.*` `build` `dist` `*.egg` `venv`)을 **대체**하지 않도록 함께 적는다 —
# 명시하면 기본값이 사라진다.
norecursedirs = evals/scenarios .* build dist *.egg venv node_modules

addopts = -q
