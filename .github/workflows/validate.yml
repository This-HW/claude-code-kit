name: Validate Plugins

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Validate plugin.json files
        run: |
          for f in plugins/*/.claude-plugin/plugin.json; do
            echo "Checking $f..."
            python3 -c "import json,sys; json.load(open(sys.argv[1])); print('✓ Valid JSON')" "$f"
          done

      - name: Check plugin.json required fields
        run: |
          python3 - <<'EOF'
          import json, pathlib, sys
          REQUIRED = ["name", "version", "description", "homepage", "repository", "license"]
          errors = []
          for f in pathlib.Path("plugins").glob("*/.claude-plugin/plugin.json"):
              data = json.loads(f.read_text())
              for field in REQUIRED:
                  if field not in data:
                      errors.append(f"{f}: missing required field '{field}'")
              author = data.get("author", {})
              if not isinstance(author, dict) or "email" not in author:
                  errors.append(f"{f}: missing 'author.email'")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print("✓ All plugin.json files have required fields")
          EOF

      - name: Validate marketplace.json
        run: |
          python3 -c "import json; json.load(open('.claude-plugin/marketplace.json'))" && echo "✓ marketplace.json valid"

      - name: Check agent frontmatter — required fields
        run: |
          python3 - <<'EOF'
          import pathlib, re, sys
          errors = []
          for f in pathlib.Path("plugins").rglob("*.md"):
              if "/skills/" in str(f):
                  continue
              content = f.read_text()
              if not content.startswith("---"):
                  continue
              end = content.find("---", 3)
              if end == -1:
                  continue
              fm = content[3:end]
              if "name:" not in fm:
                  errors.append(f"{f}: missing 'name' in frontmatter")
              if "description:" not in fm:
                  errors.append(f"{f}: missing 'description' in frontmatter")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print("✓ All agent frontmatter valid")
          EOF

      - name: Check agent frontmatter — no forbidden fields
        run: |
          python3 - <<'EOF'
          import pathlib, re, sys
          FORBIDDEN = ["permissionMode", "context_cache", "output_schema", "next_agents", "hooks"]
          errors = []
          for f in pathlib.Path("plugins").rglob("*.md"):
              if "/skills/" in str(f):
                  continue
              content = f.read_text()
              if not content.startswith("---"):
                  continue
              end = content.find("---", 3)
              if end == -1:
                  continue
              fm = content[3:end]
              for field in FORBIDDEN:
                  if re.search(rf"^{field}:", fm, re.MULTILINE):
                      errors.append(f"{f}: forbidden field '{field}' in frontmatter")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print("✓ No forbidden frontmatter fields found")
          EOF

      - name: Run hook unit tests
        run: |
          # ruff 버전은 .ruff-version 에 핀(F-036): 도구 기본 룰셋이 릴리스마다 바뀌어
          # "코드 변경 없이 CI가 red"가 되는 사고를 막는다(2.12.0 실사고). 룰 집합 자체는
          # 루트 ruff.toml 이 명시 — 로컬 훅/게이트와 판정이 항상 일치한다.
          pip install pytest "ruff==$(cat .ruff-version)" --quiet
          ruff check .   # 범위·룰 = ruff.toml SSOT (verify-done.sh §3과 동일 커맨드)
          # pytest exit 5 = "no tests collected" (OK to skip). 그 외 비정상 종료는
          # 실제 실패이므로 CI를 실패시킨다 (이전 `|| echo`는 실패도 green으로 삼켰음).
          rc=0
          python3 -m pytest plugins/common/hooks/tests/ evals/tests/ -v || rc=$?
          # exit 5(수집 0)도 실패 — 테스트 220+개가 상존하는 레포에서 수집 0은
          # 전멸/경로 붕괴 신호다. verify-done §4와 fail-closed 방향 통일 (재감사 R2/ATK-004).
          if [ "$rc" -eq 5 ]; then echo "❌ No tests collected — 테스트 소실은 실패다"; exit 1; fi
          exit "$rc"

      - name: Check doc agent/skill counts (drift guard)
        # scripts/check_doc_counts.py 가 단일 소스 (F-023) — 로컬 verify-done.sh §6과
        # 동일 스크립트. 여기 인라인 재구현 금지(로직 이중화 = 드리프트).
        run: python3 scripts/check_doc_counts.py

      - name: Security scan (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 소비자 환경 최저 파이썬(=macOS 기본 python3 3.9)에서 훅이 실제로 뜨는지 검증한다.
  # 훅은 소비자 머신의 `python3`로 실행되므로, 3.10 전용 문법이 들어가면 그 사용자에겐
  # 훅이 전부 죽는다(2.12.0까지 4종이 그 상태였다 — F-037). 린트의 FA 룰이 정적 방어,
  # 이 잡이 실행 방어다.
  python39-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.9
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.9"

      - name: Hooks import/실행 스모크 (python 3.9)
        run: |
          set -e
          for f in plugins/common/hooks/*.py plugins/common/setup/*.py scripts/*.py; do
            case "$f" in */tests/*) continue ;; esac
            out=$(echo '{}' | python3 "$f" --help 2>&1 || true)
            if echo "$out" | grep -qE "TypeError: unsupported operand|SyntaxError|ModuleNotFoundError"; then
              echo "❌ $f — python 3.9에서 로드 실패"; echo "$out" | tail -5; exit 1
            fi
            echo "✓ $f"
          done
